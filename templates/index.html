<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Readability Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center py-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-white md:text-4xl">AI Readability Diagnostic</h1>
            <p class="text-slate-400 mt-2">Audit how effectively AI agents and web crawlers extract your product data.</p>
        </header>

        <!-- Search Bar -->
        <div class="flex flex-col sm:flex-row gap-3">
            <input id="urlInput" type="url" placeholder="https://example.com/product" class="flex-1 px-4 py-3 bg-slate-800 rounded-lg border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="runAudit()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg transition-all flex items-center justify-center gap-2">
                <span>Run Audit</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>

        <!-- Audit Loading / Results Container -->
        <div id="results" class="hidden space-y-6"></div>

    </div>

    <script>
    async function runAudit() {
        const urlInput = document.getElementById('urlInput').value.trim();
        if (!urlInput) return;

        // 1. Check local storage rate limits
        let usageCount = parseInt(localStorage.getItem('audit_count') || '0');

        if (usageCount >= 3) {
            // Replace with your Lemon Squeezy checkout link when active
            if (window.LemonSqueezy) {
                LemonSqueezy.Url.Open('https://yourstore.lemonsqueezy.com/buy/variant_id?embed=1');
            }
            alert('Free limit reached (3/3 audits used). Upgrade to unlock unlimited checks and automated fixes.');
            return;
        }

        const resultsDiv = document.getElementById('results');
        resultsDiv.classList.remove('hidden');
        resultsDiv.innerHTML = `
            <div class="p-8 bg-slate-800 rounded-xl border border-slate-700 text-center space-y-3 animate-pulse">
                <p class="text-lg font-medium text-slate-300">Scanning site structure, robots.txt, and product schema...</p>
                <p class="text-xs text-slate-500">This takes 3–6 seconds</p>
            </div>
        `;

        try {
            const response = await fetch('/audit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();
            
            // Increment usage count upon successful scan
            localStorage.setItem('audit_count', usageCount + 1);

            renderAuditData(data);
        } catch (e) {
            resultsDiv.innerHTML = `
                <div class="p-6 bg-red-950/40 rounded-xl border border-red-800/50 text-center text-red-300">
                    Scan failed. Please check the URL or try again in a moment.
                </div>
            `;
        }
    }

    function renderAuditData(data) {
        const resultsDiv = document.getElementById('results');
        const breakdown = data.breakdown;

        // Robots list rendering
        let botListHtml = '';
        if (breakdown.bot_accessibility.details) {
            botListHtml = Object.entries(breakdown.bot_accessibility.details)
                .map(([bot, allowed]) => `
                    <div class="flex justify-between items-center text-xs py-1">
                        <span class="text-slate-300">${bot}</span>
                        <span class="${allowed ? 'text-green-400' : 'text-red-400'}">${allowed ? '✓ Allowed' : '✕ Blocked'}</span>
                    </div>
                `).join('');
        }

        // Schema Fix Code Snippet HTML
        let snippetHtml = '';
        if (breakdown.schema_json_ld.fix_snippet) {
            snippetHtml = `
                <div class="mt-3 p-3 bg-slate-950 rounded border border-slate-800">
                    <p class="text-xs font-semibold text-yellow-400 mb-1">Recommended JSON-LD Fix Snippet:</p>
                    <pre class="text-xs text-green-400 overflow-x-auto p-2 bg-slate-900 rounded"><code>${escapeHtml(breakdown.schema_json_ld.fix_snippet)}</code></pre>
                </div>
            `;
        }

        const scoreColor = data.overall_ai_score >= 80 ? 'text-green-400' : (data.overall_ai_score >= 60 ? 'text-yellow-400' : 'text-red-400');
        const badgeBg = data.overall_ai_score >= 80 ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20';

        resultsDiv.innerHTML = `
            <!-- Top Summary Card -->
            <div class="p-6 bg-slate-800 rounded-xl border border-slate-700 space-y-3">
                <div class="flex flex-wrap justify-between items-center gap-4">
                    <div>
                        <span class="px-3 py-1 rounded-full text-xs font-semibold border ${badgeBg}">${data.summary}</span>
                        <h2 class="text-2xl font-bold mt-2">Overall Readability Index</h2>
                        <p class="text-xs text-slate-400 break-all">${data.url}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-4xl font-extrabold ${scoreColor}">${data.overall_ai_score}</span>
                        <span class="text-slate-500 font-semibold text-lg">/100</span>
                    </div>
                </div>
            </div>

            <!-- Breakdown Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- Bot Accessibility -->
                <div class="p-5 bg-slate-800 rounded-xl border border-slate-700 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-slate-200">🤖 Bot Accessibility</h3>
                            <span class="text-xs font-semibold text-slate-400">${breakdown.bot_accessibility.score}/25</span>
                        </div>
                        <div class="space-y-1">${botListHtml}</div>
                    </div>
                </div>

                <!-- Sitemap Indexing -->
                <div class="p-5 bg-slate-800 rounded-xl border border-slate-700 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-slate-200">🌿 Sitemap Indexing</h3>
                            <span class="text-xs font-semibold text-slate-400">${breakdown.sitemap_status.score}/25</span>
                        </div>
                        <p class="text-xs ${breakdown.sitemap_status.found ? 'text-green-400' : 'text-red-400'}">
                            ${breakdown.sitemap_status.found ? '✓ Sitemap found' : '✕ ' + (breakdown.sitemap_status.issue || 'Sitemap missing')}
                        </p>
                        ${breakdown.sitemap_status.sitemap_url ? `<p class="text-xs text-slate-500 mt-1 break-all">${breakdown.sitemap_status.sitemap_url}</p>` : ''}
                    </div>
                </div>

                <!-- Product Metadata -->
                <div class="p-5 bg-slate-800 rounded-xl border border-slate-700 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-slate-200"></> Product Metadata</h3>
                            <span class="text-xs font-semibold text-slate-400">${breakdown.schema_json_ld.score}/25</span>
                        </div>
                        <p class="text-xs text-slate-300">Format Detected: <span class="font-semibold text-white">${breakdown.schema_json_ld.format || 'None'}</span></p>
                        ${breakdown.schema_json_ld.missing_fields ? `<p class="text-xs text-slate-400 mt-1">Missing Fields: ${breakdown.schema_json_ld.missing_fields.join(', ')}</p>` : ''}
                        ${snippetHtml}
                    </div>
                </div>

                <!-- Semantic HTML -->
                <div class="p-5 bg-slate-800 rounded-xl border border-slate-700 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-slate-200">🥞 Semantic HTML</h3>
                            <span class="text-xs font-semibold text-slate-400">${breakdown.semantic_html.score}/25</span>
                        </div>
                        <p class="text-xs text-slate-300">Tags Found: <span class="text-slate-400">${breakdown.semantic_html.found_tags?.length ? breakdown.semantic_html.found_tags.join(', ') : 'None'}</span></p>
                        ${breakdown.semantic_html.missing_tags?.length ? `<p class="text-xs text-yellow-400 mt-1">Missing Elements: ${breakdown.semantic_html.missing_tags.join(', ')}</p>` : ''}
                    </div>
                </div>

            </div>
        `;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    </script>
</body>
</html>
