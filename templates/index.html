<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Readability Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lemon Squeezy Overlay JS -->
    <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="text-center py-6">
            <h1 class="text-3xl font-bold">AI Readability Diagnostic</h1>
            <p class="text-slate-400 mt-2">Check if your e-commerce store is readable by AI agents</p>
        </header>

        <div class="flex gap-2">
            <input id="urlInput" type="url" placeholder="https://yourstore.com/product" class="flex-1 px-4 py-3 bg-slate-800 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-blue-500">
            <button onclick="runAudit()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg">Run Audit</button>
        </div>

        <div id="results" class="hidden space-y-6">
            <!-- Dynamic audit results rendered here -->
        </div>
    </div>

    <script>
    async function runAudit() {
        const urlInput = document.getElementById('urlInput').value.trim();
        if (!urlInput) return;

        // Check local audit count
        let usageCount = parseInt(localStorage.getItem('audit_count') || '0');

        if (usageCount >= 3) {
            // Replace with your actual Lemon Squeezy checkout URL
            LemonSqueezy.Url.Open('https://yourstore.lemonsqueezy.com/buy/variant_id?embed=1');
            alert('You have used your 3 free audits. Please upgrade to unlock unlimited checks.');
            return;
        }

        const resultsDiv = document.getElementById('results');
        resultsDiv.classList.remove('hidden');
        resultsDiv.innerHTML = '<p class="text-center text-slate-400">Running diagnostic scan...</p>';

        try {
            const response = await fetch('/audit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();
            
            // Increment usage count on successful request
            localStorage.setItem('audit_count', usageCount + 1);

            let snippetHtml = '';
            if (data.breakdown.schema_json_ld.fix_snippet) {
                snippetHtml = `
                    <div class="mt-4 p-4 bg-slate-950 rounded border border-slate-800">
                        <p class="text-xs font-semibold text-yellow-400 mb-2">Recommended Fix Snippet:</p>
                        <pre class="text-xs text-green-400 overflow-x-auto"><code>${escapeHtml(data.breakdown.schema_json_ld.fix_snippet)}</code></pre>
                    </div>
                `;
            }

            resultsDiv.innerHTML = `
                <div class="p-6 bg-slate-800 rounded-xl border border-slate-700">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-lg font-semibold">${data.summary}</span>
                        <span class="text-3xl font-bold ${data.overall_ai_score >= 80 ? 'text-green-400' : 'text-yellow-400'}">${data.overall_ai_score}/100</span>
                    </div>
                    <p class="text-xs text-slate-400">${data.url}</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="p-4 bg-slate-800 rounded-lg border border-slate-700">
                        <h3 class="font-bold mb-2">Bot Accessibility (${data.breakdown.bot_accessibility.score}/25)</h3>
                        <p class="text-sm text-slate-300">Crawlers Allowed: ${data.breakdown.bot_accessibility.score / 5}/5</p>
                    </div>
                    <div class="p-4 bg-slate-800 rounded-lg border border-slate-700">
                        <h3 class="font-bold mb-2">Sitemap Indexing (${data.breakdown.sitemap_status.score}/25)</h3>
                        <p class="text-sm text-slate-300">${data.breakdown.sitemap_status.found ? 'Sitemap found' : 'Sitemap missing'}</p>
                    </div>
                    <div class="p-4 bg-slate-800 rounded-lg border border-slate-700">
                        <h3 class="font-bold mb-2">Product Metadata (${data.breakdown.schema_json_ld.score}/25)</h3>
                        <p class="text-sm text-slate-300">Format: ${data.breakdown.schema_json_ld.format || 'None'}</p>
                        ${snippetHtml}
                    </div>
                    <div class="p-4 bg-slate-800 rounded-lg border border-slate-700">
                        <h3 class="font-bold mb-2">Semantic HTML (${data.breakdown.semantic_html.score}/25)</h3>
                        <p class="text-sm text-slate-300">Found tags: ${data.breakdown.semantic_html.found_tags ? data.breakdown.semantic_html.found_tags.join(', ') : 'None'}</p>
                    </div>
                </div>
            `;
        } catch (e) {
            resultsDiv.innerHTML = '<p class="text-center text-red-400">Scan failed. Check URL or network connection.</p>';
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    </script>
</body>
</html>
